<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop premium footwear at KRITHE STORE. Sneakers, running shoes, formal wear and more.">
  <title>Shop — KRITHE STORE</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="loader-overlay"><div class="loader"></div></div>
  <header class="navbar" id="navbar"></header>

  <main class="section" style="padding-top:140px">
    <div class="container">
      <h1 class="section-title">Our Collection</h1>
      <p class="section-subtitle">Explore our curated selection of premium footwear</p>

      <div class="filters-bar">
        <div class="search-box">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search shoes, brands...">
        </div>
        <select id="categoryFilter" class="filter-select">
          <option value="">All Categories</option>
          <option value="Sneakers">Sneakers</option>
          <option value="Running">Running</option>
          <option value="Formal">Formal</option>
          <option value="Casual">Casual</option>
          <option value="Boots">Boots</option>
          <option value="Outdoor">Outdoor</option>
        </select>
        <select id="sortFilter" class="filter-select">
          <option value="default">Newest</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>

      <div class="product-grid" id="productGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/products.js"></script>
  <script>document.addEventListener('DOMContentLoaded', Products.initProductsPage);</script>
</body>
</html>
