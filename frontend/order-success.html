<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — KRITHE STORE</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="loader-overlay"><div class="loader"></div></div>
  <header class="navbar" id="navbar"></header>

  <main class="success-page">
    <div>
      <div class="success-icon">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h1>Order Confirmed!</h1>
      <p style="color:var(--text-secondary);max-width:400px;margin:0 auto">
        Thank you for shopping with KRITHE STORE. Your premium footwear is on its way.
      </p>

      <div class="success-details glass">
        <div class="row"><span>Order Number</span><span id="orderNumber" style="color:var(--gold)"></span></div>
        <div class="row"><span>Total Paid</span><span id="orderTotal"></span></div>
        <div class="row"><span>Date</span><span id="orderDate"></span></div>
        <div class="row"><span>Status</span><span id="orderStatus" style="color:var(--success)"></span></div>
      </div>

      <a href="products.html" class="btn btn-primary" style="margin-top:16px">Continue Shopping</a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/cart.js"></script>
  <script>document.addEventListener('DOMContentLoaded', OrderSuccess.init);</script>
</body>
</html>
