<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — KRITHE STORE</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="loader-overlay"><div class="loader"></div></div>
  <header class="navbar" id="navbar"></header>

  <main class="auth-page">
    <div class="auth-card glass">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your KRITHE STORE account</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
          <div class="form-error" data-error="email">Please enter a valid email</div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
          <div class="form-error" data-error="password">Password must be at least 6 characters</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script>document.addEventListener('DOMContentLoaded', Auth.initLoginForm);</script>
</body>
</html>
