spring.application.name=krithe-store
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/krithe_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=KritheStorePremiumSecretKey2024MustBeAtLeast256BitsLongForHS256Algorithm!!
jwt.expiration=86400000

# Razorpay (replace with your keys)
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=your_razorpay_secret

# CORS
# Add your frontend dev server origins here (Live Server / python http.server). For broad
# local development you can set this to '*' but for safety we list known origins.
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5502,http://127.0.0.1:5502,http://localhost:3000,http://127.0.0.1:8080,file://
