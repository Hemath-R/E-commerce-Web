<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — KRITHE STORE</title>
  <link rel="stylesheet" href="css/main.css">
  </head>
<body>
  <div class="loader-overlay"><div class="loader"></div></div>
  <header class="navbar" id="navbar"></header>

  <main class="auth-page">
    <div class="auth-card glass">
      <h2>Create Account</h2>
      <p class="subtitle">Join KRITHE STORE for exclusive drops and offers</p>
      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Your name" required>
          <div class="form-error" data-error="fullName">Please enter your name (min 2 characters)</div>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
          <div class="form-error" data-error="email">Please enter a valid email</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            <div class="form-error" data-error="password">Password must be at least 6 characters</div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password" required>
            <div class="form-error" data-error="confirmPassword">Passwords do not match</div>
          </div>
        </div>
        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script>document.addEventListener('DOMContentLoaded', Auth.initRegisterForm);</script>
</body>
</html>
